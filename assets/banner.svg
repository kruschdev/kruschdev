<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#120c24" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="60%" stop-color="#7c4dff" />
      <stop offset="100%" stop-color="#ff4081" />
    </linearGradient>

    <!-- 13-Point Grateful Dead Lightning Bolt Gradients (matches @kruschdev Stealie avatar) -->
    <linearGradient id="boltGrad" x1="78%" y1="4%" x2="18%" y2="96%">
      <stop offset="0%" stop-color="#6ff1fe" />
      <stop offset="24%" stop-color="#37e1ff" />
      <stop offset="48%" stop-color="#7be8ff" />
      <stop offset="72%" stop-color="#8b6eff" />
      <stop offset="90%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <radialGradient id="boltCoreGlow" cx="55%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#e6fdff" stop-opacity="0.72" />
      <stop offset="48%" stop-color="#67e8f9" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="boltRimGrad" x1="80%" y1="0%" x2="15%" y2="100%">
      <stop offset="0%" stop-color="#bef8ff" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#f5d0fe" />
      <stop offset="100%" stop-color="#fae8ff" />
    </linearGradient>

    <radialGradient id="ambientCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#00e5ff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#7c4dff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0.4)" />
      <stop offset="50%" stop-color="rgba(124, 77, 255, 0.2)" />
      <stop offset="100%" stop-color="rgba(0, 229, 255, 0.1)" />
    </linearGradient>

    <!-- SVG 1.1 Universal Neon Glow Filter -->
    <filter id="boltNeonGlow" x="-40%" y="-30%" width="180%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6.5" result="outerBlur" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="innerBlur" />
      <feMerge>
        <feMergeNode in="outerBlur" />
        <feMergeNode in="innerBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect width="1000" height="280" rx="16" />
    </clipPath>

    <clipPath id="deadBoltClip">
      <polygon points="121,2 79,25 93,28 48,50 78,53 19,89 58,85 5,128 44,124 5,158 34,155 4,212 47,191 35,186 70,171 52,168 105,139 66,140 123,103 74,105 128,69 86,69 126,35 102,36" />
    </clipPath>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 229, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <g clip-path="url(#cardClip)">
    <rect width="1000" height="280" rx="16" fill="url(#bgGrad)" />
    <rect width="1000" height="280" rx="16" fill="url(#cyberGrid)" />

    <!-- Ambient Glow Clouds -->
    <circle cx="118" cy="105" r="145" fill="url(#ambientCyan)" />
    <circle cx="92" cy="195" r="125" fill="url(#ambientPurple)" />
    <circle cx="880" cy="180" r="170" fill="url(#ambientPurple)" />
  </g>
  <rect width="1000" height="280" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- 13-Point Grateful Dead Lightning Bolt (matches @kruschdev Stealie avatar) -->
  <g transform="translate(46, 34) scale(0.86)">
    <!-- Soft Neon Aura -->
    <polygon
      points="121,2 79,25 93,28 48,50 78,53 19,89 58,85 5,128 44,124 5,158 34,155 4,212 47,191 35,186 70,171 52,168 105,139 66,140 123,103 74,105 128,69 86,69 126,35 102,36"
      fill="url(#boltGrad)"
      opacity="0.55"
      filter="url(#boltNeonGlow)"
    />
    <!-- Crisp Cyan -> Purple-Magenta Core -->
    <polygon
      points="121,2 79,25 93,28 48,50 78,53 19,89 58,85 5,128 44,124 5,158 34,155 4,212 47,191 35,186 70,171 52,168 105,139 66,140 123,103 74,105 128,69 86,69 126,35 102,36"
      fill="url(#boltGrad)"
    />
    <!-- Central Ice-Cyan Luminance Bloom -->
    <ellipse cx="68" cy="98" rx="48" ry="54" fill="url(#boltCoreGlow)" clip-path="url(#deadBoltClip)" />
    <!-- Luminous White-Cyan-Orchid Outer Rim -->
    <polygon
      points="121,2 79,25 93,28 48,50 78,53 19,89 58,85 5,128 44,124 5,158 34,155 4,212 47,191 35,186 70,171 52,168 105,139 66,140 123,103 74,105 128,69 86,69 126,35 102,36"
      fill="none"
      stroke="url(#boltRimGrad)"
      stroke-width="2.5"
      stroke-linejoin="miter"
      stroke-miterlimit="8"
    />
  </g>

  <!-- Header Title -->
  <g transform="translate(180, 85)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="42" fill="#ffffff" letter-spacing="0.5">
      KEVIN RUSCHMAN
    </text>
    <text x="430" y="-3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#00e5ff" letter-spacing="1.5">
      @kruschdev
    </text>
  </g>

  <!-- Role Subtitle -->
  <g transform="translate(180, 126)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="20" fill="url(#accentGrad)" letter-spacing="0.8">
      AI Systems Architect &amp; Open Source Maintainer
    </text>
  </g>

  <!-- Tagline -->
  <g transform="translate(180, 160)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="14.5" fill="#94a3b8" letter-spacing="0.2">
      Local-First Agent Infrastructure · PostgreSQL Transaction Invariants · Sub-15µs CPU Cascade Routing
    </text>
  </g>

  <!-- Pill Badges -->
  <g transform="translate(180, 195)">
    <!-- Badge 1: krusch-context -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="17" fill="rgba(0, 229, 255, 0.08)" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#00e5ff" />
      <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">krusch-context-mcp</text>
    </g>

    <!-- Badge 2: krusch-cascade-router -->
    <g transform="translate(192, 0)">
      <rect width="175" height="34" rx="17" fill="rgba(124, 77, 255, 0.12)" stroke="rgba(124, 77, 255, 0.4)" stroke-width="1" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#d8b4fe">★ krusch-cascade-router</text>
    </g>

    <!-- Badge 3: 3-Tier Sovereign Stack -->
    <g transform="translate(379, 0)">
      <rect width="190" height="34" rx="17" fill="rgba(255, 64, 129, 0.08)" stroke="rgba(255, 64, 129, 0.3)" stroke-width="1" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#fbcfe8">3-Tier Sovereign MCP</text>
    </g>

    <!-- Badge 4: Location / Sovereign -->
    <g transform="translate(581, 0)">
      <rect width="165" height="34" rx="17" fill="rgba(148, 163, 184, 0.08)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">📍 Los Angeles, CA</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="60" y1="250" x2="940" y2="250" stroke="url(#borderGrad)" stroke-width="1" />
</svg>
